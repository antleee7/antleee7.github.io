
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Anthony Lee</title>

    <style>
        body {
            font-family: sans-serif;
            font-size: 15px;
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            border-bottom: 1px solid #ccc;
            font-weight: normal;
        }

        a {
            color: inherit;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .photo img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .photo p {
            color: gray;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .photo img {
                height: 180px;
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .photo img {
                height: auto;
            }
        }
    </style>
</head>

<body>
    <h1>Photography</h1>

    <p><a href="index.html">← Back to homepage</a></p>

    <p>A collection of photographs I've taken.</p>

    <div class="gallery">

        <div class="photo">
            <a href="photos/photo1.jpg" target="_blank">
                <img src="photos/photo1.jpg" alt="Photograph 1">
            </a>
            <p>Boston, February 2026</p>
        </div>

        <div class="photo">
            <a href="photos/photo2.jpg" target="_blank">
                <img src="photos/photo2.jpg" alt="Photograph 2">
            </a>
            <p>Seoul, 2025</p>
        </div>

        <div class="photo">
            <a href="photos/photo3.jpg" target="_blank">
                <img src="photos/photo3.jpg" alt="Photograph 3">
            </a>
            <p>Somewhere, 2024</p>
        </div>

    </div>
</body>
</html>
